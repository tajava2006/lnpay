# Web Push 중계 — admin.hoppe-relay.it.com 서버 블록 안에 넣는다
#
# ── 왜 필요한가
#
# 푸시 서비스는 "애플리케이션 서버가 POST한다"를 전제로 만들어졌다. 그런데 이 앱은
# 백엔드가 없어서 어드민 브라우저 탭이 그 역할을 한다. 브라우저가 쏘는 순간 CORS가
# 걸리는데, 푸시 서비스 중 브라우저 오리진을 허용하는 건 모질라뿐이다:
#
#   Mozilla  ✅ ACAO로 오리진 에코
#   FCM      ❌ preflight 400, ACAO 없음   ← 크롬·엣지·삼성인터넷·브레이브·웨일
#   Apple    ❌ OPTIONS 405                ← 사파리
#
# 즉 파이어폭스 유저 말고는 아무도 못 받는다. 이 블록이 그걸 푼다.
#
# ── 하는 일은 오리진 세탁뿐이다
#
#   어드민 탭 ──→ admin.hoppe-relay.it.com/push/... ──→ 푸시 서비스
#                 (같은 오리진 = CORS 없음)            (서버끼리 = CORS 없음)
#
# 페이로드는 구독자 공개키로 이미 암호화돼 있다(RFC 8291). nginx는 암호문을 옮길
# 뿐 못 읽는다. 그래서 중계를 끼우는 게 프라이버시 후퇴가 아니다.
#
# ── 설치
#
#   1. map 블록을 http {} 안에 (nginx.conf 또는 conf.d/*.conf)
#   2. location 블록을 admin 도메인의 server {} 안에
#   3. nginx -t && systemctl reload nginx
#
# 앱 쪽 설정은 없다. 프로덕션 빌드는 같은 오리진의 `/push`를 기본값으로 쓴다
# (admin/src/web-push/send.ts). env 파일을 VPS에 심을 필요가 없다.

# ─────────────────────────────────────────────────────────────────────
# http {} 레벨
# ─────────────────────────────────────────────────────────────────────

# 중계를 허용할 푸시 서비스. **화이트리스트가 없으면 오픈 프록시가 된다** —
# 누구나 우리 서버를 거쳐 아무 데나 POST할 수 있게 된다.
map $push_host $push_host_allowed {
    default                              0;
    updates.push.services.mozilla.com    1;
    fcm.googleapis.com                   1;
    web.push.apple.com                   1;
}

# 이 중계를 쓸 수 있는 오리진. **프로덕션에는 사실 필요 없다** — 어드민이 같은
# 도메인에서 서빙되므로 CORS가 성립하지 않는다.
#
# 남겨두는 건 로컬 개발 어드민(localhost)에서 이 프록시를 가리키고 싶을 때를
# 위해서다. 그럴 일이 없으면 이 map과 아래 CORS 블록을 통째로 빼도 된다.
map $http_origin $push_cors_origin {
    default                              "";
    "https://admin.hoppe-relay.it.com"   $http_origin;
    "~^http://localhost:[0-9]+$"         $http_origin;
    "~^http://127\.0\.0\.1:[0-9]+$"      $http_origin;
}

# ─────────────────────────────────────────────────────────────────────
# server { server_name admin.hoppe-relay.it.com; ... } 안에
# ─────────────────────────────────────────────────────────────────────

location ~ ^/push/(?<push_host>[A-Za-z0-9.\-]+)/(?<push_path>.*)$ {
    # 화이트리스트 밖이면 여기서 끝
    if ($push_host_allowed = 0) {
        return 403;
    }

    # 푸시 발송은 POST뿐이다. OPTIONS는 아래 preflight에서 따로 받는다.
    if ($request_method !~ ^(POST|OPTIONS)$) {
        return 405;
    }

    # ── CORS ──
    #
    # 응답 헤더를 **always**로 붙이는 게 중요하다. 우리 JS는 404/410을 읽어서
    # 죽은 구독을 지우는데, 에러 응답에 CORS 헤더가 없으면 브라우저가 그 응답을
    # 못 읽게 막아서 "왜 실패했는지"를 구분할 수 없게 된다.
    #
    # 상류가 보낸 CORS 헤더는 먼저 걷어낸다. 모질라는 ACAO를 보내는데 우리 것과
    # 겹치면 브라우저가 "여러 값"으로 보고 통째로 거부한다.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Max-Age;

    add_header Access-Control-Allow-Origin $push_cors_origin always;
    add_header Vary Origin always;

    # preflight — Authorization·Content-Encoding·TTL이 비표준 헤더라 반드시 온다
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $push_cors_origin always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "authorization,content-encoding,content-type,ttl,urgency,topic" always;
        add_header Access-Control-Max-Age 86400 always;
        return 204;
    }

    # ── 상류로 전달 ──
    #
    # proxy_pass에 변수를 쓰면 nginx가 **요청마다** DNS를 다시 본다. 이게 필요하다 —
    # 호스트를 고정으로 적으면 기동 시 한 번 resolve하고 그 IP를 계속 쓰는데,
    # 구글·애플 같은 곳은 IP가 돌아서 언젠가 조용히 끊긴다.
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    proxy_pass https://$push_host/$push_path$is_args$args;

    # 상대가 가상호스팅이므로 SNI와 Host를 원래 대상으로 맞춰야 한다
    proxy_ssl_server_name on;
    proxy_ssl_name        $push_host;
    proxy_set_header Host $push_host;

    # VAPID JWT(Authorization)와 TTL이 그대로 가야 한다. 하나라도 빠지면 거절당한다.
    proxy_pass_request_headers on;

    # ── 브라우저 흔적을 지운다 (2026-09-17 실측으로 찾은 필수 항목) ──
    #
    # nginx는 기본적으로 클라이언트 헤더를 **전부** 상류로 넘긴다. 그런데 여기서
    # 클라이언트는 브라우저라, 브라우저 전용 헤더가 구글까지 그대로 간다.
    # 구글은 그걸 보고 "브라우저가 직접 때리는 요청"으로 판정해 **403 + HTML
    # 차단 페이지**를 준다(FCM API의 JSON 오류가 아니라 엣지 차단이다).
    #
    # 같은 요청에서 헤더만 바꿔가며 실측한 결과:
    #
    #   없음 / Origin / Referer / User-Agent / Accept-Language → 410 (정상 API 응답)
    #   Sec-Fetch-Site·Mode·Dest                               → 403 + HTML
    #
    # 범인은 Sec-Fetch-* 하나였지만, 나머지도 서버 대 서버 호출에는 의미가 없고
    # 보낼 이유도 없으므로 같이 지운다. Cookie는 특히 — 우리 도메인 쿠키가
    # 구글로 새면 안 된다. 빈 값은 nginx가 헤더 자체를 빼는 관용구다.
    proxy_set_header Sec-Fetch-Site "";
    proxy_set_header Sec-Fetch-Mode "";
    proxy_set_header Sec-Fetch-Dest "";
    proxy_set_header Sec-Fetch-User "";
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header User-Agent "pairbuy-push-relay";

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # 상류 상태코드를 그대로 돌려준다. 404/410이 "구독이 죽었다"는 신호라
    # 이걸 삼키면 죽은 구독을 영영 못 지운다.
    proxy_intercept_errors off;

    # 푸시 페이로드는 암호화해도 수 KB다. 크게 열어둘 이유가 없다.
    client_max_body_size 16k;

    proxy_connect_timeout 10s;
    proxy_send_timeout    15s;
    proxy_read_timeout    15s;
}

name: CI

# 빌드·테스트·타입체크가 전부 수동이었다.
# ship 스크립트에 verify를 넣었지만 그건 배포하는 사람만 돌린다 —
# 푸시 시점에 한 번 더 잡아야 깨진 채로 올라가는 걸 막는다.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 버전은 package.json의 packageManager에서 읽는다 — 로컬과 CI가 갈리지 않게.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 타입체크 + 테스트 (shared / customer / admin)
      - run: pnpm verify

      # 유저스크립트 포함 전 앱이 실제로 빌드되는지
      - run: pnpm build:userscript
      - run: pnpm build:customer
      - run: pnpm build:sponsor
      - run: pnpm build:admin
      - run: pnpm build:daemon

      # 운영 PC가 빌드하는 그 이미지. Dockerfile은 워크스페이스 매니페스트를 손으로 하나씩 COPY한다 —
      # 패키지를 더하거나 파일을 옮기면 여기서 먼저 깨져야 한다(운영 PC에서 처음 알면 늦다)
      - run: docker build -f daemon/Dockerfile -t lnpay-daemon:ci .

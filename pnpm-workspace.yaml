packages:
  - 'shared'
  - 'customer'
  - 'sponsor'
  - 'admin'
  - 'daemon'
# esbuild postinstall은 플랫폼 바이너리 검증용 — vite 필수 의존성이라 허용.
# secp256k1은 bolt11(인보이스 디코딩, admin 직접 의존)이 물고 오는 네이티브 애드온 —
# 빌드를 막으면 JS 폴백으로 돌긴 하지만, 평범한 install과 같은 상태를 유지하려고 허용.
# 두 키 병기: pnpm 10은 onlyBuiltDependencies만, 11은 allowBuilds만 이해한다
# (서로 모르는 키는 각자 무시 — cliprelay에서 검증된 관례).
allowBuilds:
  esbuild: true
  secp256k1: true

onlyBuiltDependencies:
  - esbuild
  - secp256k1

# 막 올라온 버전은 3일 묵힌다(분 단위). latest를 따라가되, npm 계정 탈취로 올라온 악성 버전이 보통 며칠 안에
# 내려가는 그 창을 피한다 — 유저 앱은 브라우저에 nsec를 들고 있어 악성 의존성 하나가 곧 키 탈취다.
# 해석할 때만 본다: 락파일대로 까는 설치(--frozen-lockfile, CI·ship)는 영향이 없다.
minimumReleaseAge: 4320
